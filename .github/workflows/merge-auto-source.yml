name: Merge auto-source into main
on:
  workflow_dispatch:
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}

      - name: Fetch all branches
        run: git fetch origin

      - name: Show diff between auto-source and main
        run: |
          echo "===== auto-source VS main 差异预览 ====="
          git diff origin/main origin/auto-source --stat

      - name: Switch to main branch
        run: git checkout main

      - name: Merge auto-source into main
        run: |
          git merge origin/auto-source --no-ff -m "Merge branch 'auto-source' into main [Auto Merge]"

      - name: Push merged result to main
        run: git push origin main
